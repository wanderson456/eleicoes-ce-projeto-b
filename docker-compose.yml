services:
  db:
    image: postgres:16-alpine
    container_name: eleicoes-ce-projeto-b-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - eleicoes_ce_projeto_b_data:/var/lib/postgresql/data
      - ./data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eleicoes-ce-projeto-b-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eleicoes_ce_projeto_b_data:
    name: eleicoes_ce_projeto_b_pgdata
