openapi: 3.0.3

info:
  title: API Eleições Ceará
  version: 1.0.0
  description: API REST para consulta de dados eleitorais por município e seção, com suporte a diferentes anos e turnos eleitorais.

servers:
  - url: http://localhost:3001
    description: Ambiente local com Docker Compose

security: []

tags:
  - name: Saúde
    description: Verificação de disponibilidade da API
  - name: Votos
    description: Consulta de resultados eleitorais por seção
  - name: Observabilidade
    description: Métricas HTTP da aplicação
  - name: Resultados
    description: Consulta consolidada de resultados eleitorais por município, cargo e eleição

paths:
  /health:
    get:
      tags:
        - Saúde
      summary: Verifica a saúde da API
      operationId: getHealth
      responses:
        "200":
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                  - status

  /municipios/{codigo}/secoes:
    get:
      tags:
        - Votos
      summary: Lista as secoes eleitorais de um municipio
      operationId: getSectionsByMunicipality
      parameters:
        - name: codigo
          in: path
          required: true
          description: Codigo IBGE do municipio com exatamente sete digitos
          schema:
            type: string
            pattern: '^\d{7}$'
          example: "2300200"
        - name: ano
          in: query
          required: true
          description: Ano da eleição
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2022
        - name: pagina
          in: query
          required: false
          description: Numero da pagina
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limite
          in: query
          required: false
          description: Quantidade de registros por pagina
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Lista de secoes retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        municipalityCode:
                          type: string
                          example: "2300200"
                        zone:
                          type: integer
                          example: 30
                        section:
                          type: integer
                          example: 1
                        latitude:
                          type: number
                          nullable: true
                          example: -3.745
                        longitude:
                          type: number
                          nullable: true
                          example: -38.520
                      required:
                        - municipalityCode
                        - zone
                        - section
                        - latitude
                        - longitude
                  total:
                    type: integer
                    example: 166
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
                  totalPages:
                    type: integer
                    example: 9
                required:
                  - items
                  - total
                  - page
                  - limit
                  - totalPages
        "400":
          description: Parametros invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor

  /municipios/{codigo}/secoes/{zona}/{secao}/votos:
    get:
      tags:
        - Votos
      summary: Consulta votos registrados em uma seção eleitoral
      operationId: getVotesBySection
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código do município com exatamente cinco dígitos
          schema:
            type: string
            pattern: '^\d{5}$'
          example: "23044"
        - name: zona
          in: path
          required: true
          description: Número positivo da zona eleitoral
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: secao
          in: path
          required: true
          description: Número positivo da seção eleitoral
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: ano
          in: query
          required: true
          description: Ano da eleicao
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2022
        - name: turno
          in: query
          required: true
          description: Turno eleitoral
          schema:
            type: integer
            enum: [1, 2]
          example: 1
        - name: tipo
          in: query
          required: false
          description: Filtra os registros pelo tipo de voto
          schema:
            type: string
            enum:
              - NOMINAL
              - LEGENDA
              - BRANCO
              - NULO
        - name: pagina
          in: query
          required: false
          description: Número da página dos resultados
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limite
          in: query
          required: false
          description: Quantidade de registros por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVoteResult"
        "400":
          description: Parâmetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno do servidor

  /municipios/{codigo}/resultados:
    get:
      tags:
        - Resultados
      summary: Consulta resultados eleitorais de um município
      description: Retorna os resultados agrupados por cargo, incluindo candidatos, partidos e classificação dos votos.
      operationId: getResultsByMunicipality
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código TSE do município com exatamente cinco dígitos
          schema:
            type: string
            pattern: '^\d{5}$'
          example: "13250"
        - name: ano
          in: query
          required: true
          description: Ano da eleição
          schema:
            type: integer
            minimum: 1000
            maximum: 9999
          example: 2022
        - name: turno
          in: query
          required: true
          description: Turno eleitoral
          schema:
            type: integer
            enum: [1, 2]
          example: 1
        - name: cargo
          in: query
          required: false
          description: Código do cargo para filtrar os resultados
          schema:
            type: integer
            minimum: 1
          example: 7
      responses:
        "200":
          description: Resultados eleitorais retornados com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityResult"
        "400":
          description: Parâmetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resultados não encontrados
        "500":
          description: Erro interno do servidor

  /metrics:
    get:
      tags:
        - Observabilidade
      summary: Consulta métricas HTTP da aplicação
      operationId: getMetrics
      responses:
        "200":
          description: Métricas no formato de exposição do Prometheus
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total de requisições HTTP.
                # TYPE http_requests_total counter
                http_requests_total{method="GET",route="/health",status="200"} 1

components:
  schemas:
    VoteRecord:
      type: object
      properties:
        year:
          type: integer
          example: 2022
        round:
          type: integer
          example: 1
        municipalityCode:
          type: string
          example: "23044"
        municipalityName:
          type: string
          example: Município de exemplo
        zone:
          type: integer
          example: 1
        section:
          type: integer
          example: 1
        officeCode:
          type: integer
          example: 1
        officeName:
          type: string
          example: Presidente
        voteCode:
          type: string
          example: "12"
        voteName:
          type: string
          example: Candidato ou partido
        quantity:
          type: integer
          example: 100
        candidateId:
          type: integer
          example: 123
        voteType:
          type: string
          enum:
            - NOMINAL
            - LEGENDA
            - BRANCO
            - NULO
        pollingPlaceCode:
          type: integer
          example: 123
        pollingPlaceName:
          type: string
          example: Local de votação
        pollingPlaceAddress:
          type: string
          example: Endereço do local de votação
      required:
        - year
        - round
        - municipalityCode
        - municipalityName
        - zone
        - section
        - officeCode
        - officeName
        - voteCode
        - voteName
        - quantity
        - candidateId
        - voteType
        - pollingPlaceCode
        - pollingPlaceName
        - pollingPlaceAddress

    PaginatedVoteResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoteRecord"
        total:
          type: integer
          example: 100
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 5
      required:
        - items
        - total
        - page
        - limit
        - totalPages

    CandidateResult:
      type: object
      properties:
        candidateId:
          type: integer
          format: int64
          example: 123456789
        candidateNumber:
          type: string
          example: "12345"
        candidateName:
          type: string
          example: Candidato exemplo
        partyNumber:
          type: integer
          nullable: true
          example: 10
        partyAbbreviation:
          type: string
          nullable: true
          example: ABC
        partyName:
          type: string
          nullable: true
          example: Partido ABC
        votes:
          type: integer
          example: 6000
        percentage:
          type: number
          format: double
          example: 50.00
      required:
        - candidateId
        - candidateNumber
        - candidateName
        - partyNumber
        - partyAbbreviation
        - partyName
        - votes
        - percentage

    PartyResult:
      type: object
      properties:
        partyNumber:
          type: integer
          example: 10
        partyAbbreviation:
          type: string
          nullable: true
          example: ABC
        partyName:
          type: string
          nullable: true
          example: Partido ABC
        nominalVotes:
          type: integer
          example: 11000
        legendVotes:
          type: integer
          example: 1000
        totalVotes:
          type: integer
          example: 12000
        percentage:
          type: number
          format: double
          example: 100.00
      required:
        - partyNumber
        - partyAbbreviation
        - partyName
        - nominalVotes
        - legendVotes
        - totalVotes
        - percentage

    OfficeResult:
      type: object
      properties:
        officeCode:
          type: integer
          example: 7
        officeName:
          type: string
          example: Deputado Estadual
        totalVotes:
          type: integer
          example: 12800
        validVotes:
          type: integer
          example: 12000
        nominalVotes:
          type: integer
          example: 11000
        legendVotes:
          type: integer
          example: 1000
        blankVotes:
          type: integer
          example: 500
        nullVotes:
          type: integer
          example: 300
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateResult"
        parties:
          type: array
          items:
            $ref: "#/components/schemas/PartyResult"
      required:
        - officeCode
        - officeName
        - totalVotes
        - validVotes
        - nominalVotes
        - legendVotes
        - blankVotes
        - nullVotes
        - candidates
        - parties

    MunicipalityResult:
      type: object
      properties:
        municipalityCode:
          type: string
          example: "13250"
        municipalityName:
          type: string
          example: ARARIPE
        year:
          type: integer
          example: 2022
        round:
          type: integer
          example: 1
        offices:
          type: array
          items:
            $ref: "#/components/schemas/OfficeResult"
      required:
        - municipalityCode
        - municipalityName
        - year
        - round
        - offices

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Parâmetros inválidos
        message:
          type: string
          example: O limite deve ser um inteiro entre 1 e 100.
      required:
        - error
        - message